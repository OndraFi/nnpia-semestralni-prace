spring.application.name=nnpia
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=9000

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nnpia-sem}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nnpia}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nnpia}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.type.descriptor.sql=TRACE


security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000

mailjet.api-key=${MAILJET_API_KEY}
mailjet.secret-key=${MAILJET_SECRET_KEY}

recaptcha.secret-key=${RECAPTCHA_SECRET_KEY}

frontend.url=${FRONTEND_URL:http://localhost:5173}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.docker.compose.enabled=false